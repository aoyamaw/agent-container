services:
  agent-container:
    build:
      context: .
      dockerfile: Containerfile
      args:
        USE_CHINA_APT_MIRROR: "true"
        USE_PROXY: "true"
        PROXY_IP: "192.168.3.110"
        PROXY_PORT: "7890"
        USE_CHINA_NPM_MIRROR: "true"
        USE_CHINA_GO_PROXY: "true"
        NODE_VERSION: "26.8.2"
        PNPM_VERSION: "12.4.1"
        CODEX_VERSION: "0.154.0"
        PI_VERSION: "0.85.1"
        CLAUDE_CODE_VERSION: "latest"
        CODEBUDDY_VERSION: "latest"
        GO_VERSION: "1.26.0"
        BEADS_VERSION: "latest"
        GASTOWN_VERSION: "latest"
    image: localhost/agent-container:0.2.0-gastown
    container_name: agent-container-0.2.0-gastown

    # 开启 tini 回收 tmux / Gas Town 多 Agent 产生的僵尸子进程
    init: true
    restart: unless-stopped

    # 资源护栏，防止并发编译或 Agent 失控拖垮宿主机
    mem_limit: 12g
    cpus: 6

    # SSH 端口映射 (宿主机 6666 -> 容器 22)
    ports:
      - "6666:22"

    working_dir: /home/agent/workspace

    volumes:
      # 业务代码工作区（宿主机目录直挂，方便 Remote-SSH 与 Git 管理）
      - ${WORKSPACE_HOST_DIR:-./workspace}:/home/agent/workspace:Z
      # 各 CLI 订阅登录态与 Gas Town 状态持久化（重建镜像免重登）
      - agent-codex:/home/agent/.codex
      - agent-claude:/home/agent/.claude
      - agent-gemini:/home/agent/.gemini
      - agent-pi:/home/agent/.pi
      - agent-codebuddy:/home/agent/.codebuddy
      - agent-gastown:/home/agent/gt
      # 并发 git worktree 共享 pnpm 依赖缓存
      - agent-pnpm-store:/home/agent/.local/share/pnpm/store

    environment:
      - NODE_ENV=development
      - PYTHONUNBUFFERED=1
      - WORKSPACE_DIRD=/home/agent/workspace
      - RUNTIME_PROXY=true
      - PROXY_IP=192.168.3.110
      - PROXY_PORT=7890

    stdin_open: true
    tty: true

    # 自动配置 git safe.directory 并常驻 sshd（无需 keep-id，0.5 秒瞬启）
    command: /bin/bash -c "git config --global --add safe.directory '*' && sudo /usr/sbin/sshd && exec sleep infinity"

volumes:
  agent-codex:
  agent-claude:
  agent-gemini:
  agent-pi:
  agent-codebuddy:
  agent-gastown:
  agent-pnpm-store:
